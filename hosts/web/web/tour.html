<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zui's tour</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100vh; height: 100dvh; outline: none; }
  #status { position: fixed; inset: 0; margin: 0; display: grid; place-items: center; padding: 16px; color: #ccc; font: 16px system-ui, sans-serif; text-align: center; pointer-events: none; }
  #status:empty { display: none; }
</style>
<canvas id="frame"></canvas>
<p id="status">Loading the tour…</p>
<script type="module">
  import { becomeCrossOriginIsolated } from "./cross_origin_isolation.mjs";
  import { runOnHost } from "./host_page.mjs";

  const status = document.getElementById("status");
  const stopped = (error) => {
    window.hostFailure = error.message;
    status.textContent = `The tour stopped: ${error.message}`;
  };
  try {
    if (await becomeCrossOriginIsolated("isolation_service_worker.js")) {
      window.host = await runOnHost(document.getElementById("frame"), new URL("zui-tour.wasm", location.href), stopped);
      status.textContent = "";
      window.ready = true;
    }
  } catch (error) {
    window.hostFailure = error.message;
    status.textContent = `The tour cannot run here: ${error.message}`;
    throw error;
  }
</script>
</html>
