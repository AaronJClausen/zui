name: Pages

# Published only from a push to main that CI passed, and only when CI ran
# the site's own check, which it does when the change reaches hosts/web.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.16.0

jobs:
  decide:
    name: Whether CI passed the site's check
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.site_check.outputs.publish }}
    steps:
      - id: site_check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CI_RUN: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            publish=true
          else
            site_check="hosts/web: test-site (headless Chrome)"
            # GitHub answers 502 for pages of a large run's jobs, so the pages are small and retried.
            for attempt in 1 2 3 4 5; do
              if conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs?filter=latest&per_page=20" --paginate --jq ".jobs[] | select(.name == \"$site_check\") | .conclusion"); then
                break
              fi
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep $((attempt * 10))
            done
            # A skipped job is still listed, so a missing one was renamed.
            if [ -z "$conclusion" ]; then
              echo "::error::CI has no job named \"$site_check\"; rename it here too"
              exit 1
            fi
            if [ "$conclusion" = success ]; then publish=true; else publish=false; fi
          fi
          echo "publish=$publish" | tee -a "$GITHUB_OUTPUT"

  build:
    name: The tour's page, built and checked in headless Chrome
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hosts/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup-zig
      - run: zig build site -Doptimize=ReleaseSmall
      - run: google-chrome --version
      - run: zig build test-site -Doptimize=ReleaseSmall -Dbrowser=google-chrome
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: hosts/web/zig-out/site

  deploy:
    name: Published to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
