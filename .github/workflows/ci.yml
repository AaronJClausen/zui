name: CI

on:
  push:
    branches: [main]
    paths-ignore: &ci_irrelevant_paths
      - "assets/**"
      - "**.md"
  pull_request:
    paths-ignore: *ci_irrelevant_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  lint:
    name: Format, docs and every package's check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build fmt-check
      - run: zig build docs
      - name: Install raylib's and sokol's X11, OpenGL and PulseAudio dependencies, and EGL and Wayland's
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libpulse-dev libegl-dev libwayland-dev
      - run: zig build check-all

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        optimize: [Debug, ReleaseSafe, ReleaseFast]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test -Doptimize=${{ matrix.optimize }}

  themes-and-examples:
    name: Test and check ${{ matrix.package }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [themes, examples]
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test
      - run: zig build test -Doptimize=ReleaseSafe
      - run: zig build test -Doptimize=ReleaseFast
      - run: zig build check

  terminal:
    name: "Terminal: test and build (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: renderers/terminal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test
      - run: zig build check
      - name: Render the demo offscreen
        shell: bash
        run: zig build demo -- --dump | tee dump.txt && grep -q "zui + terminal" dump.txt

  raylib-windows:
    name: "raylib: test and build (windows-latest)"
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: renderers/raylib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test
      - run: zig build test-tour
      - run: zig build check

  raylib-linux:
    name: "raylib: test, build and render (ubuntu-latest)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: renderers/raylib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install raylib's X11 and OpenGL dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev xvfb
      - run: zig build test
      - run: zig build check
      - name: Run zui's renderer and host suites
        run: xvfb-run --auto-servernum zig build conformance
      - run: zig build test-tour
      - name: Visit every screen of the tour
        run: |
          set -o pipefail
          xvfb-run --auto-servernum zig build demo -- --hidden --frames 600 --cycle 50 2>&1 | tee cycle.log
          grep "diagnostics ok: true" cycle.log
      - name: Render the tour offscreen
        run: |
          for screen in welcome gallery mission_control typography light_and_depth; do
            xvfb-run --auto-servernum zig build demo -- --screenshot "$PWD/demo-$screen.png" --screen $screen
          done
      - name: Report the CPU used while idle
        run: |
          timeout 60 xvfb-run --auto-servernum zig build demo -- --measure-idle 2>&1 | grep "^idle" | tee idle.log
          echo "The tour's welcome screen, $(cat idle.log)" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the renders
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-screenshots
          path: renderers/raylib/demo*.png

  raylib-macos:
    name: "raylib: build (macos-latest)"
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: renderers/raylib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build check

  sokol-conformance:
    name: "sokol: renderer suite (Linux, OpenGL under Xvfb)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: renderers/sokol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install sokol's X11, OpenGL and PulseAudio dependencies, EGL and Wayland's, and Xvfb
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libpulse-dev libegl-dev libwayland-dev xvfb
      - run: xvfb-run --auto-servernum zig build conformance

  sokol:
    name: "sokol: test and build (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: renderers/sokol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install sokol's X11, OpenGL and PulseAudio dependencies, and EGL and Wayland's
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libpulse-dev libegl-dev libwayland-dev
      - run: zig build test
      - run: zig build check
      - name: Compile the renderer for a native host's win32 window, with OpenGL
        if: runner.os == 'Windows'
        run: zig build check -Dgl=true
      - run: zig build test-tour

  tracy:
    name: Tracy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test -Dzui-tracy=true

  thread-sanitizer:
    name: Test (ThreadSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # ThreadSanitizer cannot place its shadow memory with the runner's
      # default ASLR entropy, and exits before any test runs.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: zig build test -Dzui-sanitize-thread=true

  test-32-bit:
    name: Test (32-bit x86 Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test -Dtarget=x86-linux
      - run: zig build test -Dtarget=x86-linux -Doptimize=ReleaseFast

  cross-check:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm32-freestanding
          - x86-linux
          - aarch64-linux
          - aarch64-macos
          - x86_64-windows
          - powerpc-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build check -Dtarget=${{ matrix.target }}

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # Times are reported, never compared: a runner can time one commit 45%
      # slower than its parent when no other machine can reproduce it. This
      # still fails on any allocation after init, which no CPU can change.
      - name: Benchmark
        run: |
          # Without this, `| tee` hides a failing benchmark: steps without a
          # `shell:` run as `bash -e`, not `bash -eo pipefail`.
          set -o pipefail
          zig build bench | tee bench.txt
          { echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  counts:
    name: Instruction counts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      # Each commit is counted by its own scenarios. A parent from before
      # `counts` existed has nothing to compare against.
      - name: Count the parent commit
        run: |
          git worktree add --detach "$RUNNER_TEMP/parent" HEAD^
          cd "$RUNNER_TEMP/parent"
          if zig build -l | grep -q '^  counts '; then
            zig build counts -- --json "$RUNNER_TEMP/parent.json"
          fi
      - name: Count this commit, failing on more than 2% growth
        run: |
          set -o pipefail
          compare=()
          if [ -f "$RUNNER_TEMP/parent.json" ]; then compare=(--compare "$RUNNER_TEMP/parent.json"); fi
          zig build counts -- --json counts.json "${compare[@]}" | tee counts.txt
          { echo '```'; cat counts.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
