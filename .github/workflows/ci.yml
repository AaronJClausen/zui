name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  lint:
    name: Format and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build fmt-check
      - run: zig build docs

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test -Doptimize=Debug
      - run: zig build test -Doptimize=ReleaseSafe
      - run: zig build test -Doptimize=ReleaseFast

  test-32-bit:
    name: Test (32-bit x86 Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test -Dtarget=x86-linux
      - run: zig build test -Dtarget=x86-linux -Doptimize=ReleaseFast

  cross-check:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm32-freestanding
          - x86-linux
          - aarch64-linux
          - aarch64-macos
          - x86_64-windows
          - powerpc-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build check -Dtarget=${{ matrix.target }}

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # Fails if this commit is more than 10% slower than the one before,
      # timed on the same runner. The §6.5 targets are reported but not
      # enforced: runners differ by 2x (62.6 µs to 125.3 µs for the box tree
      # across three runs), so a fixed limit would fail at random.
      - name: Check out the commit to compare against
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare against."
            exit 0
          fi
          git worktree add ../base "$BASE_SHA"
          if (cd ../base && zig build -l | grep -q "^  bench "); then
            echo "compare=true" >> "$GITHUB_OUTPUT"
          else
            echo "The earlier commit has no benchmarks."
          fi
      - name: Benchmark
        env:
          COMPARE: ${{ steps.base.outputs.compare }}
        run: |
          # Without this, `| tee` hides a failing benchmark: steps without a
          # `shell:` run as `bash -e`, not `bash -eo pipefail`.
          set -o pipefail
          if [ "$COMPARE" != "true" ]; then
            zig build bench | tee bench.txt
          else
            # A shared runner's speed drifts between runs, so a regression
            # must show up in each of three alternating measurements.
            passed=false
            for attempt in 1 2 3; do
              (cd ../base && zig build bench -- --json "$GITHUB_WORKSPACE/base.json" > /dev/null)
              if zig build bench -- --compare base.json | tee bench.txt; then
                passed=true
                break
              fi
              echo "Attempt $attempt measured a regression; measuring again."
            done
            [ "$passed" = true ] || exit 1
          fi
          { echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
