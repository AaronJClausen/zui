name: CI

on:
  push:
    branches: [main]
    paths-ignore: &ci_irrelevant_paths
      - "assets/**"
      - "**.md"
  pull_request:
    paths-ignore: *ci_irrelevant_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  lint:
    name: Format and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build fmt-check
      - run: zig build docs

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test -Doptimize=Debug
      - run: zig build test -Doptimize=ReleaseSafe
      - run: zig build test -Doptimize=ReleaseFast

  tracy:
    name: Tracy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test -Dzui-tracy=true

  test-32-bit:
    name: Test (32-bit x86 Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test -Dtarget=x86-linux
      - run: zig build test -Dtarget=x86-linux -Doptimize=ReleaseFast

  cross-check:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm32-freestanding
          - x86-linux
          - aarch64-linux
          - aarch64-macos
          - x86_64-windows
          - powerpc-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build check -Dtarget=${{ matrix.target }}

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # Times are reported, never compared: a runner can time one commit 45%
      # slower than its parent when no other machine can reproduce it. This
      # still fails on any allocation after init, which no CPU can change.
      - name: Benchmark
        run: |
          # Without this, `| tee` hides a failing benchmark: steps without a
          # `shell:` run as `bash -e`, not `bash -eo pipefail`.
          set -o pipefail
          zig build bench | tee bench.txt
          { echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  counts:
    name: Instruction counts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      # Each commit is counted by its own scenarios. A parent from before
      # `counts` existed has nothing to compare against.
      - name: Count the parent commit
        run: |
          git worktree add --detach "$RUNNER_TEMP/parent" HEAD^
          cd "$RUNNER_TEMP/parent"
          if zig build -l | grep -q '^  counts '; then
            zig build counts -- --json "$RUNNER_TEMP/parent.json"
          fi
      - name: Count this commit, failing on more than 2% growth
        run: |
          set -o pipefail
          compare=()
          if [ -f "$RUNNER_TEMP/parent.json" ]; then compare=(--compare "$RUNNER_TEMP/parent.json"); fi
          zig build counts -- --json counts.json "${compare[@]}" | tee counts.txt
          { echo '```'; cat counts.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
